<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Roadmap — PathFinder</title><link rel="stylesheet" href="style.css"></head><body>
<nav><a class="logo" href="index.html">PathFinder</a><div class="navlinks"><a href="index.html">Home</a><a href="explore.html">Explore</a><a href="skills.html">Skills</a><a href="assistant.html">AI</a></div></nav><header class="pagehead"><h1 id="title">Career Roadmap</h1><p>A simple step-by-step plan you can customize.</p></header><main class="container"><div class="formbox"><select id="career" onchange="render()"><option>Software Developer</option><option>Data Analyst</option><option>UI/UX Designer</option><option>Doctor</option><option>Digital Marketer</option><option>Law</option></select><div id="road" class="timeline"></div></div></main><script>
const plans={ "Software Developer":["Choose C/Python/JavaScript","Learn programming + DSA","Build web/app projects","Learn Git/GitHub + databases","Do internships","Build portfolio and apply"],"Data Analyst":["Learn Excel","Learn SQL","Learn Python + pandas","Study statistics","Build dashboards/projects","Apply for analyst internships"],"UI/UX Designer":["Learn design basics","Learn Figma","Practice user research","Create wireframes/prototypes","Build 3 case studies","Apply for internships"],"Doctor":["Choose PCB pathway","Prepare for medical entrance","Join an approved medical program","Complete clinical learning/internship","Build medical knowledge","Consider specialization"],"Digital Marketer":["Learn marketing fundamentals","Learn SEO + content","Learn social media","Learn analytics","Run sample campaigns","Build portfolio"],"Law":["Build reading/reasoning skills","Explore law entrance options","Study legal foundations","Practice research and writing","Do internships/moots","Build professional network"]};
function render(){let c=document.getElementById("career").value;document.getElementById("title").textContent=c+" Roadmap";document.getElementById("road").innerHTML=plans[c].map((x,i)=>`<div class="step"><h3>Step ${i+1}</h3><p>${x}</p></div>`).join("")}
const p=new URLSearchParams(location.search).get("career");if(p){let o=[...document.querySelectorAll("#career option")].find(x=>x.textContent===p);if(o)document.getElementById("career").value=p}render();
</script></body></html>
