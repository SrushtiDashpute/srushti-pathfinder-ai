<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Analyzer — PathFinder</title><link rel="stylesheet" href="style.css"></head><body>
<nav><a class="logo" href="index.html">PathFinder</a><div class="navlinks"><a href="index.html">Home</a><a href="explore.html">Explore</a><a href="interview.html">Interview</a><a href="dashboard.html">Dashboard</a></div></nav><header class="pagehead"><h1>AI Resume Analyzer</h1><p>Upload a PDF/TXT resume or paste your text.</p></header><main class="container"><div class="formbox"><form id="rf"><label>Resume file</label><input type="file" id="resume" accept=".pdf,.txt"><label>Or paste resume text</label><textarea id="resumeText"></textarea><br><button class="btn" type="submit">Analyze Resume</button></form><div id="resumeResult" class="result" style="display:none"></div></div></main><script>
document.getElementById("rf").addEventListener("submit",async e=>{e.preventDefault();let fd=new FormData();let f=document.getElementById("resume").files[0];if(f)fd.append("resume",f);fd.append("resume_text",document.getElementById("resumeText").value);let box=document.getElementById("resumeResult");box.style.display="block";box.textContent="Analyzing...";try{if(window.location.hostname.includes("github.io")||!window.location.hostname){throw new Error("demo");}let r=await fetch("/api/resume",{method:"POST",body:fd});let d=await r.json();box.textContent=d.answer||d.error}catch(x){const text=document.getElementById("resumeText").value.trim();if(!text){box.textContent="GitHub Pages demo mode: paste your resume text above to get a quick analysis.";return;}const words=text.toLowerCase();let score=50;["education","skills","project","experience","contact","github","linkedin"].forEach(k=>{if(words.includes(k))score+=7;});score=Math.min(100,score);box.textContent=`Quick Resume Check (GitHub Pages demo)\n\nScore: ${score}/100\n\nSuggestions:\n• Keep a clear Education and Skills section.\n• Add 2–3 measurable projects.\n• Include GitHub/LinkedIn links.\n• Use action verbs and concise bullet points.\n• Tailor skills to your target role.`}});
</script></body></html>
